<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>VitaMate - dieta, zakupy i treningi w jednym planie</title>
    <meta
      name="description"
      content="Twórz jadłospisy z własnych produktów, generuj listy zakupów i układaj plany treningowe. Wszystko w jednym kalendarzu."
    />
    <meta name="theme-color" content="#F4F1E8" />
    <script>
      // Motyw: localStorage "vita-mate-theme" = "light" | "dark".
      // Bez wpisu (lub z inną wartością) obowiązują ustawienia systemu.
      // Ustawiany przed pierwszym renderem, żeby strona nie mignęła w złym motywie.
      // Po ręcznej zmianie wpisu w localStorage odśwież stronę.
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('vita-mate-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#142119' : '#F4F1E8'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
